allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': true
  # false: o postinstall do esbuild tenta EXECUTAR o binário (falha com EACCES na Hostinger).
  # O chmod em scripts/postinstall-host.mjs restaura +x antes do build.
  esbuild: false
  protobufjs: true
  re2: true
  ttf2woff2: false
overrides:
  rollup: 4.62.4
  # Mínimo corrigido dos advisories high/critical do `pnpm audit`.
  '@grpc/grpc-js': '1.14.5'
  '@xmldom/xmldom': '0.9.12'
  # Cada major do brace-expansion tem API diferente. 5.x quebra o minimatch 3/5/6/9.
  'brace-expansion@^1.1.7': '1.1.21'
  'brace-expansion@^2.0.1': '2.1.7'
  'brace-expansion@^2.0.2': '2.1.7'
  'brace-expansion@^5.0.8': '5.0.12'
  'minimatch@3>brace-expansion': '1.1.21'
  'minimatch@5>brace-expansion': '2.1.7'
  'minimatch@6>brace-expansion': '2.1.7'
  'minimatch@9>brace-expansion': '2.1.7'
  'minimatch@10>brace-expansion': '5.0.12'
  # 3.1.8 fecha o moderate novo de normalização de host; 3.1.7 já era override.
  'ajv>fast-uri': '3.1.8'
  'happy-dom': '>=20.8.9'
  js-yaml: '4.3.2'
  'nanoid@3': '3.3.18'
  nodemailer: '>=10.0.6'
  svgo: '4.1.0'
  tmp: '0.2.7'
  undici: '8.11.2'
  # GHSA do devalue <=5.9.2 (Nuxt e i18n). Nuxt 4.5 pede ^5.8.2; 5.9.4 cabe nessa faixa.
  devalue: '5.9.4'
  # GHSA-xjh9-v7x6-24jw / GHSA-x8mw-p69m-v3mx (@fastify/busboy via firebase-admin)
  '@fastify/busboy': '>=3.2.1'
  # GHSA-c475-qrg2-pj4r: basic-ftp <=6.2.0. get-uri (via Lighthouse) pede ^5.
  'get-uri>basic-ftp': '6.2.1'
  # Hostinger: binário Dart do sass-embedded falha com EACCES.
  # Bloquear só o *-linux-* deixa o pacote JS do sass-embedded instalado;
  # o Vite prefere ele e trava em "unavailable in pure JS mode" (Vitest/Nuxt setup).
  # Remover o pacote inteiro força o Vite a usar `sass` (JS).
  sass-embedded: '-'
  sass-embedded-linux-x64: '-'
  sass-embedded-linux-musl-x64: '-'
  # GHSA de out/2026 — fixes publicados, overrides com range >=:
  '@modelcontextprotocol/sdk': '>=1.31.0'
  '@simple-git/argv-parser': '>=2.0.1'
  '@vue/server-renderer': '>=3.5.42'
  compression: '>=1.8.2'
  proxy-addr: '>=2.0.8'
  seroval: '>=1.6.3'
  shell-quote: '>=1.11.0'
  source-map-js: '>=1.2.2'
  tinypool: '>=2.1.2'
  handlebars: '>=4.7.10'

# extract-zip 2.0.2 (correção do GHSA) ainda não foi publicado no npm.
# Entra só via @lhci/cli > lighthouse > puppeteer, ferramenta de dev.
audit:
  ignore:
    - GHSA-jmr9-qjv8-65gv
    - GHSA-7pqw-9j4j-h8q3
    # node-forge <=1.4.0 (RSA PKCS#1, via listhen do @nuxt/cli/nitro). Fix >=1.4.1
    # NÃO existe publicado (latest = 1.4.0). Dev-only (servidor de dev do Nuxt),
    # sem uso em runtime/produção. Reavaliar quando o fix sair.
    - GHSA-86w9-cpqp-85rv
    # braces <3.0.4 (via micromatch do fast-glob do @nuxtjs/i18n — build only).
    # Override direto quebra firebase-tools (pede ~3.0.3). Reavaliar quando o
    # ecossistema subir micromatch.
    - GHSA-vfj7-8cjw-p6xm
    # http-cache-semantics <4.2.1 (via node-gyp do ttf2woff2 do tabler — dev only).
    # Fix >=4.2.1 NAO publicado (latest = 4.2.0). Reavaliar quando sair.
    - GHSA-ch52-4w7c-c8xp
    # simple-git: fix high (3.36.1) NAO existe no registry (3.36.0 → 4.0.0) e a
    # 4.x quebra o postinstall do Nuxt devtools (sem default export). Dev-only.
    # Reavaliar quando o devtools subir pra >=4.
    - GHSA-x6jw-m9v5-85vh
    - GHSA-g4wm-2vf7-vfgr
    - GHSA-858h-whjf-mvg5
