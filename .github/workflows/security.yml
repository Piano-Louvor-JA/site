# Security jobs em todo PR e no push de staging/main.
# Gitleaks fica só no PR staging → main (workflow CI Main).
# Bloqueia PR com: dependência vuln high+, [EXTRA] semgrep SAST
name: security
on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  # Gitleaks — segredos no diff/historico (padrao da org, copiado do web)
  secrets:
    name: gitleaks (segredos no diff/histórico)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # CLI open source. A action oficial (gitleaks-action@v2) passou a exigir
      # licenca paga (GITLEAKS_LICENSE) e quebrava todo PR de organizacao.
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C "$RUNNER_TEMP"
      - name: Scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            "$RUNNER_TEMP/gitleaks" detect --source . --redact --config .gitleaks.toml --log-opts="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            "$RUNNER_TEMP/gitleaks" detect --source . --redact --config .gitleaks.toml
          fi

  dependencies:
    name: npm audit (high+ bloqueia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # O site resolve dependências com pnpm. `npm ci` quebra no peer de
      # vue3-apexcharts e nunca chega no audit.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level=high

  sast:
    name: semgrep SAST
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # Só app/ e server/, só severidade ERROR. `auto` no repo inteiro marcava
      # tag @v4 dos workflows e .npmrc como bloqueio (53 findings).
      - name: Scan
        run: |
          semgrep scan --config p/javascript --config p/typescript \
            --severity ERROR --error \
            app server
